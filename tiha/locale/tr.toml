# ==========================================================================
# Adım 4: Toplu pin anahtarı (m03_otp_secrets)
# ==========================================================================

[m03]
title = "Öğretmen PIN anahtarları"
sidebar_title = "Toplu pin anahtarı"
apply_hint = """\
Listedeki ve yedek hesaplar için PIN anahtarları üretilir. Anahtarı zaten \
olan hesaplara dokunulmaz; yalnızca eksikler tamamlanır. Çıktı, sistemdeki \
tüm anahtarları QR kodlarıyla birlikte içeren yazdırılabilir bir HTML \
kâğıdıdır.\
"""
rationale = """\
Her öğretmen için 6 haneli pin kodu üreten anahtarları toplu olarak üretir.\n\
\n\
Anahtar nedir, kod nedir?\n\
\u0020\u0020• Anahtar: Telefona kurulan uygulamada (Google Authenticator \
vb.) saklanan, uzun ve gizli bir tanıtıcıdır — bir tür dijital kimlik kartı. \
Bir kez kurulur, sonra hep telefonda durur.\n\
\u0020\u0020• Kod: Bu anahtar kullanılarak zamana bağlı olarak üretilen, 30 \
saniyede bir değişen 6 haneli bir sayıdır. Tahtaya giriş yaparken bu sayıyı \
yazarsınız. Geçici bir parola gibi düşünün — her seferinde tahtanın kabul \
ettiği yeni bir kapı şifresi.\n\
\n\
Olağan kullanımda her öğretmen kendi anahtarını uygulamasından üretip her \
tahtaya tek tek (dışa aktar / içe aktar) yüklemek zorundadır; onlarca \
tahtada bu işlem pratik değil. Bu adım anahtarları imaj alınmadan ÖNCE her \
öğretmen için merkezî olarak üretir ve imaja gömer. İmajdan dağıtılan tüm \
tahtalarda anahtarlar hazır gelir; öğretmen yalnızca kendi anahtarını size \
verdiğimiz biçimde (yazılı veya QR kodu olarak) uygulamasına bir kez ekler \
ve sonra ister sınıf 1'deki tahta olsun ister sınıf 50'deki, hepsinde kendi \
PIN kodunu görüp girerek oturum açabilir.\n\
\n\
Dikkat: Otomatik parola temizliği adımı uygulandıysa öğretmen tahtada kendi \
PIN'ini üretemez (yerel parola bilinmediği için); bu durumda anahtarları \
merkezî olarak üretmek mecburidir. Uygulanmadıysa da tek tek kurulumdan çok \
daha hızlıdır.\n\
\n\
Önemli: Öğretmenin tahtada kişisel hesabı ilk EBA QR girişiyle oluşur; PIN \
kodu ve USB ile giriş ancak bundan sonra kullanılabilir. Kişisel hesabı \
henüz oluşmamış bir öğretmen, EBA QR çalışmadığında (internet yok, uygulama \
ya da altyapı sorunu) tahtaya yalnızca ortak hesapla girebilir. Bu durum \
için kullanım politikanıza göre ya ortak hesabın parolasını paylaşın \
(sınıfta yazılırken öğrenciler de görebilir) ya da 'Ortak öğretmen hesabı \
(ogretmen) için de PIN üret' seçeneğiyle ortak hesaba PIN anahtarı \
tanımlayın. Not: ogretmenler grubu ortak PIN'i ortak ogretmen hesabında \
geçmez; yalnız gruba üye kişisel ve yedek (ogretmen1, ogretmen2 …) \
hesaplarda geçer.\n\
\n\
Geri alma ile varsayılan kullanıcılar (etapadmin, ogrenci, ogretmen) \
dışındakiler silinir.\
"""

