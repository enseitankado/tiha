# ==========================================================================
# Adım 2: Yerel hesaplar (m01_initial_passwords)
# ==========================================================================

[m01]
title = "Kullanıcı parolaları"
sidebar_title = "Yerel hesaplar"
apply_hint = """\
Parolalar SHA-512 hash olarak doğrudan /etc/shadow'a yazılır. Doldurduğunuz \
alanlara göre ilgili hesapların parolaları ayarlanır; eski parolayla şifreli \
kalan GNOME anahtarlıkları kenara alınır.\
"""
rationale = """\
root, etapadmin veya ogretmen hesaplarından istediğinizin parolasını \
belirleyin. Hangi alanları doldurursanız sadece o hesapların parolası \
değişir; diğerlerine dokunulmaz.\n\
\n\
Parola değişen hesabın GNOME anahtarlığı eski parolayla şifreli kaldığı için \
girişte 'Bilgisayara giriş yapmak için kullandığınız parola artık giriş \
anahtarlığınızla uyuşmuyor' diyaloğu çıkar ve doğru parola bile kabul \
edilmez (anahtarlık eski parolayı bekler). Bu adım bayatlayan anahtarlığı \
kenara alır; ilk girişte yenisi yeni parolayla otomatik oluşturulur. Geri \
alma dosyaları yerine koyar.\n\
\n\
Ortak hesap neden önemli? Öğretmenin tahtada kişisel hesabı ilk EBA QR \
girişiyle oluşur; PIN kodu ve USB ile giriş ancak bundan sonra \
kullanılabilir. Öğretmen kişisel hesabını henüz oluşturmamışsa ve EBA QR \
çalışmıyorsa (internet yok, uygulama ya da altyapı sorunu) tahtaya yalnızca \
ortak hesapla (ogretmen) girebilir. Tahtaların kullanım politikanıza göre ya \
bu ortak hesabın parolasını öğretmenlerle paylaşmanız (sınıfta yazılırken \
öğrenciler de görebilir) ya da 'Öğretmen PIN anahtarları' adımında ortak \
hesap için PIN anahtarı tanımlamanız gerekir.\
"""

[m01.params.root_password]
label = "Yeni root parolası (isteğe bağlı)"
help = "Teknik ekibin tahtaya yönetici olarak bağlanacağı parola. Boş bırakılabilir."

[m01.params.admin_password]
label = "Yeni etapadmin parolası (isteğe bağlı)"
help = "Tahtada yerel yönetim işleri için kullanılacak parola. Boş bırakılabilir."

[m01.params.teacher_password]
label = "Öğretmen parolası (isteğe bağlı)"
help = "Öğretmen hesabı varsa, bu hesap için parola belirleyebilirsiniz. Boş bırakılabilir."

[m01.params.reserve_count]
