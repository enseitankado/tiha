[m13]
title = "EBA QR parola diyalogu"
sidebar_title = "QR Parola Diyaloğu"
apply_hint = "EBA QR ile ilk girişte otomatik açılan parola tanımlama diyalogu devre dışı bırakılır."
rationale = """\
Bir kullanıcı tahtaya EBA QR kodu ile ilk kez giriş yaptığında, sistem \
otomatik olarak parola tanımlama penceresini açar. Sınıf ortamında öğretmen, \
parolasını öğrencilerin önünde klavyeden yazmak durumunda kalabilir ve bu \
da parolanın istemeden ifşa olmasına yol açabilir.\n\
\n\
Bu adım, ilk girişte otomatik açılan diyalogu kapatır. Kullanıcının parolası \
olmamış olur; tahtaya yine yalnızca EBA QR ile giriş yapılır. Bir öğretmen \
kendi parolasını koymak isterse her zaman Sistem Ayarları > Kullanıcı \
Hesapları üzerinden uygun bir ortamda (örneğin teneffüste, sınıf boşken) \
tanımlayabilir.\
"""

