# ==========================================================================
# Adım 12: Uzaktan uyandırma (m15_wake_on_lan)
# ==========================================================================

[m15]
title = "Uzaktan uyandırma (Wake-on-LAN)"
sidebar_title = "Uzaktan uyandırma"
apply_hint = "Ağ kartının magic packet dinleme ayarı her boot'ta yeniden yazılır."
rationale = """\
Bu adım, klonlanmış tahtaların ağ kartını her açılışta Wake-on-LAN modunda \
tutar. Böylece bakımcı merkez bilgisayarından tahtaya 'magic packet' \
göndererek kapalı tahtayı uzaktan açabilir; sabah 07:50'de tüm sınıflar \
açılmış hâlde 09:00 dersine hazır bekler.\n\
\n\
Bu adımın çalışması için üç katman gerekir: (1) BIOS/UEFI setup'ta 'Wake on \
LAN' (veya 'WOL') AÇIK; 'Power On by PCI-E' AÇIK; ve — en kritik nokta — \
'ErP' ile 'Deep Sleep' KAPALI olmalı. ErP veya Deep Sleep açık bırakılırsa \
BIOS, tahta kapatıldığında ağ kartına standby gücü kesecek şekilde davranır \
ve magic packet duyulmaz (Linux WoL doğru olsa bile tahta uyanmaz). (2) \
Linux tarafında ethtool ile magic packet dinleme modu yazılmalı — bu ayar \
kalıcı olmadığı için TiHA'nın bu adımda kurduğu servis her boot'ta yeniden \
yazar. (3) Ethernet kablosu takılı olmalı ve switch, kapalı bilgisayarın \
portuna güç kesmemelidir.\n\
\n\
BIOS ayarları imaj klonlamayla taşınmaz (CMOS'ta tutulur, disk imajından \
bağımsızdır) — her tahta için bir kez elle yapılır. Faz 2 Vestel \
modellerinde fabrika ayarı olarak WoL genelde AÇIK gelir; ancak ErP/Deep \
Sleep açık gelebilir, bu yüzden sahada her tahta için BIOS'a girip bu iki \
seçeneğin KAPALI olduğunu doğrulamak gerekir. Linux katmanı ise bu adımın \
kurduğu systemd servisi ile her klonda otomatik hazır olur.\n\
\n\
Merkezden uyandırma için bakımcı kendi bilgisayarında 'wakeonlan <mac>' veya \
'etherwake <mac>' komutunu kullanır. TiHA merkez betiği yazmaz; bakımcının \
kendi tarafında bir cron işiyle sabah tüm tahtaları toplu uyandırabilir.\
"""

