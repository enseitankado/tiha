# ==========================================================================
# Adım 13: Başarım (Deneysel) (m17_performance)
# ==========================================================================

[m17]
title = "Başarım (Deneysel)"
sidebar_title = "Başarım (Deneysel)"
doc_label = "Başarım (Deneysel) — mekanizma, ölçümler ve tahtada deneme"
apply_hint = """\
Oturum kapanınca kalan süreçler sonlandırılır (açılıştan sonra); seçilirse \
ETA Hafif Mod tüm kullanıcılara uygulanır ve imleç düzeltmesi kurulur.\
"""
rationale = """\
Bir öğretmen tarayıcısını kapatmadan oturumunu kapattığında Firefox, Chrome \
ve bütün alt süreçleri arka planda çalışmaya devam eder. Dört sekmeli bir \
tarayıcı 600 MB – 1 GB bellek tutar ve işlemci harcamayı sürdürür. Tahta gün \
içinde yeniden başlatılmadığında her yeni öğretmen oturumu bu yükün üstüne \
eklenir.\n\
\n\
\"Eski oturum kalıntılarını temizle\" seçeneği, oturum kapanınca o oturumdan \
kalan her süreci sistemin kendi oturum yöneticisine (systemd-logind) \
sonlandırtır. Ayar bir sonraki açılışta etkin olur.\n\
\n\
ETA Hafif Mod, Pardus'un düşük donanımlı tahtalar için hazırladığı \
eta-light-mode paketidir. Seçilen ayarlar tahtadaki bütün kullanıcılara her \
oturum açılışında uygulanır. Çözünürlük ve yenileme hızı düşürme ekranı ve \
kalem çizgisini bulanıklaştırır; önce tek bir tahtada deneyin.\n\
\n\
Hafif mod kutusu sistemin o anki durumunu gösterir. Kutu işaretliyken \
kaldırılıp uygulanırsa hafif mod sistemden kaldırılır ve daha önce giriş \
yapmış hesapların masaüstü ayarları da geri alınır. Paket kaldırılmaz: ETAP \
imajının parçası, kaldırılması ayarları geri almaya yetmez ve geri almak \
için gereken aracı da yok eder.\n\
\n\
⚠ DİKKAT: Bu adımın uyguladığı değişiklikler — özellikle hafif mod \
(kompozitör kapatma, çözünürlük düşürme, yenileme hızı 50 Hz, yazı/ikon \
ölçekleme) — hâlihazırda Pardus ETAP üzerinde kullandığınız uygulama \
programlarının görsel arayüzlerinde renk ve fiziksel ölçü açısından \
kullanımı olumsuz etkileyebilecek sonuçlara yol açabilir: pencereler \
beklenenden farklı boyutta açılabilir, buton/menü hizaları bozulabilir, \
kalem çizgisi bulanıklaşabilir, video/tam ekran içeriklerde renk yırtılması \
görülebilir. Klonlamaya başlamadan önce ÖRNEK MAKİNEDE gerekli kontrolleri \
ve testleri yapmayı unutmayın; sınıfta kullanılan eğitim yazılımları, EBA \
içerikleri, sunum araçları ve tarayıcı üzerinde açık video/etkileşimli \
içeriklerle bir tur çalıştırıp davranışlarını gözle doğrulayın.\
"""

[m17.params]
heading_session = "Oturum kalıntıları"
heading_light_mode = "ETA Hafif Mod (eta-light-mode)"
heading_cursor = "Fare imleci (ekran modu değişimi)"

[m17.params.cursor_xorg_fix]
opt_off = "Kapalı"
opt_modesetting = "modesetting sürücüsüne geç"
opt_swcursor = "modesetting + yazılımsal imleç (SWcursor)"
label = "İmleç kaybolmasını önle (Xorg)"
help = """\
Tahtada çözünürlük ya da tazeleme frekansı değiştirilip uygulandığında fare \
imleci görünmez oluyor; tıklama ve odak çalışmaya devam ediyor, fare \
çıkarılıp takılınca düzeliyor. Nedeni, mod değişiminde donanımsal imleç \
düzleminin yeniden kurulurken imleç görüntüsünü geri yüklememesi.\n\
\n\
'modesetting sürücüsüne geç': /etc/X11/xorg.conf.d/20-tiha-imlec.conf \
yazılır; ETAP'ta kurulu gelen eski intel sürücüsü yerine çekirdeğin \
modesetting sürücüsü kullanılır. Başarım bedeli yoktur; önce bunu deneyin.\n\
\n\
'+ yazılımsal imleç': aynı dosyaya Option \"SWcursor\" \"on\" eklenir; \
donanımsal imleç tamamen kapanır, kaybolacak düzlem kalmaz. Kesin çözümdür \
ama imleci her karede sistem çizer; zayıf tahtalarda hızlı fare hareketinde \
hafif gecikme görülebilir.\n\
\n\
Değişiklik oturum (LightDM) yeniden başlayınca geçerli olur.\
"""

[m17.params.kill_user_processes]
label = "Eski oturum kalıntılarını temizle"
help = """\
Öğretmen oturumunu kapattığında o oturumdan kalan bütün süreçler \
(kapatılmadan bırakılan Firefox/Chrome ve alt süreçleri dahil) \
sonlandırılır. Tahta yeniden başlatılınca etkin olur. Aynı kullanıcının SSH \
gibi başka açık oturumlarına dokunulmaz; root hariç tutulur. Bu ayar \
system-wide logind yapılandırmasıdır; klon tahtaya sonradan eklenen hesaplar \
dahil, root dışındaki tüm kullanıcılara otomatik uygulanır.\
"""

[m17.params.light_mode_enabled]
label = "Hafif modu tüm kullanıcılara uygula"
help = """\
Paket yoksa kurulur. Seçilen ayarlar system-wide olarak \
/etc/eta-light-mode/settings.json'a ve /etc/xdg/autostart'a yazılır; her \
kullanıcıya (klon tahtaya sonradan eklenen hesaplar dahil) oturum açılışında \
uygulanır. Kullanıcı kendi oturumunda değiştirse de bir sonraki girişte \
yeniden uygulanır. Kutu sistemin o anki durumunu gösterir: işaretliyken \
kaldırıp uygularsanız hafif mod sistemden kaldırılır ve daha önce giriş \
yapmış hesapların masaüstü ayarları da geri alınır. Paket kaldırılmaz.\
"""

[m17.params.lm_effects]
