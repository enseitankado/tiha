# TiHA arayüz metinleri (Türkçe).
#
# Ekranda görünen bütün metinler bu dosyadadır; kod yalnızca anahtarları
# kullanır (ör. t("m01.title")). Metni değiştirmek için değeri düzenleyin,
# anahtarı (= işaretinin solu) değiştirmeyin.
#
# - {ad} biçimindeki yer tutucuları silmeyin; program onları doldurur.
#   Yer tutucu içeren metinlerde düz süslü parantez {{ ve }} yazılır.
# - Uzun metinler """ ile açılıp kapanır. Satır sonundaki \ işareti
#   yalnızca dosyada satırı sarar; ekranda metin kesintisiz akar.
#   \n yeni satır demektir.
# - Başka bir dil için bu dosyanın kopyasını en.toml gibi adlandırıp
#   değerleri çevirin; TIHA_LANG=en ile çalıştırın. Eksik kalan
#   anahtarlar Türkçe gösterilir.

