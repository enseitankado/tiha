[m16.params.enable_grub_lock]
label = "GRUB koruması etkin"
help = """\
Kutucuk, adıma girildiğinde sistemin o anki durumunu gösterir; GRUB zaten \
korumalıysa işaretli gelir. İŞARETİ KALDIRIP UYGULARSANIZ koruma kaldırılır: \
01_tiha_grub_password silinir, 10_linux'teki TiHA yamaları sökülür, \
update-grub çalıştırılır; menü, kurtarma girdisi dahil, parolasız hâline \
döner. Koruma etkinken parola alanını boş bırakıp uygularsanız mevcut parola \
korunur.\n\
\n\
İşaretlenirse GRUB önyükleme menüsünde 'e' (düzenle) kipine girildiğinde ya \
da GRUB shell'ine ('c' tuşu) düşüldüğünde GRUB önce KULLANICI ADI sorar — \
aşağıdaki salt okunur 'GRUB kullanıcı adı' kutusundaki değer — ardından \
'GRUB yönetici parolası' alanına yazılan parolayı ister. Kurtarma (recovery) \
girdisi menüde kalır; onu ve 'Gelişmiş seçenekler' alt menüsünü açmak da \
aynı kullanıcı adı ve parolayı ister (kurtarma kipi parolasız root kabuğu \
verdiği için). Boot akışının kendisi bu parolayı sormaz; yalnız menüye elle \
müdahale eden kişi görür.\n\
\n\
Neden gerekli? GRUB varsayılan olarak fiziksel klavye erişimi olan herkese \
kernel komut satırını düzenleme hakkı verir. Buraya 'init=/bin/bash' \
yazılırsa sistem doğrudan root shell açar; oradan da parola değiştirmek, \
diski okumak, tahtayı kalıcı olarak ele geçirmek mümkündür. Bu kutucuk o \
vektörü tek bir hash ile tüm klonlarda kapatır.\n\
\n\
Nasıl çalışır? Adım, aşağıya yazdığınız parolanın PBKDF2-SHA512 hash'ini \
/etc/grub.d/01_tiha_grub_password içine yazar; /etc/grub.d/10_linux'ta menü \
girdilerine --unrestricted bayrağı ekler (menü seçilirken parola sorulmasın \
diye), kurtarma girdilerini bu bayraktan muaf tutar ve alt menü girdilerinin \
açılış varsayılanı olarak kaydedilmesini engeller (gözetimsiz açılış parola \
ekranında beklemesin); update-grub çalıştırıp üretilen menüyü denetler. \
TiHA'nın eski sürümü kurtarma girdisini GRUB_DISABLE_RECOVERY ile \
kapatıyordu; bu adım onu geri açar. Hash imaja gömüldüğü için aynı parola \
tüm klonlarda geçerli olur; düz parola sistemde tutulmaz.\
"""

[m16.params.grub_username]
label = "GRUB kullanıcı adı"
help = """\
GRUB, parolayı sormadan önce bir kullanıcı adı ister ('Enter username:'). \
Açılış ekranında bu kutudaki adı yazacaksınız. Değer adımın kendisi \
tarafından belirlenir, değiştirilemez; GRUB'ın kendi kullanıcı listesinde \
tanımlı bir addır, sistemdeki etapadmin hesabıyla ve onun parolasıyla ilgisi \
yoktur.\
"""

[m16.params.grub_password]
label = "GRUB yönetici parolası"
help = """\
GRUB menü kipine ('e' tuşu) ya da GRUB shell'ine ('c' tuşu) girmeye çalışan \
kullanıcıdan istenecek parola. GRUB ekranında önce 'Enter username:' çıkar; \
oraya yukarıdaki 'GRUB kullanıcı adı' kutusundaki ad yazılır, sonra bu \
parola girilir. Bu adımda girdiğiniz metnin PBKDF2-SHA512 hash'i \
/etc/grub.d/01_tiha_grub_password içine yazılır ve klon imajına gömülür; düz \
parola sistemde tutulmaz. Kutucuk işaretsizken bu alan pasiftir. Aynı \
parolayı bütün klonlar kullanır — operatörün hatırlaması gereken tek bir \
parola olur.\
"""

