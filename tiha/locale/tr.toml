# ==========================================================================
# Adım 6: SSH Sunucusu (m04_ssh_server)
# ==========================================================================

[m04]
title = "SSH sunucusu (root girişi)"
sidebar_title = "SSH Sunucusu"
apply_hint = "openssh-server kurulur, uzak root girişi açılır."
rationale = """\
Tahtaları sınıflara dağıttıktan sonra uzaktan bakım yapabilmek için SSH \
sunucusunu kurar ve root kullanıcısının uzak oturum açmasına izin verir; \
sorun giderme, ayar değişikliği ve günlük inceleme için kullanılır.\n\
\n\
Uzaktan bağlanmak için tahtayla aynı ağda olmalısınız. Okulda tahtalar ve \
kablosuz erişim noktaları (AP) genellikle `10.x.x.x` aralığındadır — bu \
ağdaki bir bilgisayardan `ssh root@<tahta-ip>` komutunu kullanırsınız. \
Farklı bir ağdan (örn. öğrenci/misafir ağları) ulaşılamaz; bu bilinçli bir \
güvenlik kısıtıdır. Okul içinde güvenlik duvarı/VLAN ile erişimi yalnızca \
yönetim istasyonlarıyla sınırlamanız tavsiye edilir.\
"""

[m04.notice]
root_missing = """\
Root parolası tanımlı değil. SSH ile root olarak bağlanabilmek için önce \
\"Yerel hesaplar\" adımında root parolasını belirleyin. Parola \
belirlenmezse sunucu kurulur ama uzaktan kimse giriş yapamaz."""
root_unknown = """\
SSH ile root olarak bağlanabilmek için root parolasının tanımlı olması \
gerekir. \"Yerel hesaplar\" adımında root parolasını belirlediğinizden \
emin olun."""
root_set = """\
Uzaktan root girişinde \"Yerel hesaplar\" adımında belirlediğiniz root \
parolası kullanılır. Bu parola imajdan çoğaltılan bütün tahtalarda aynı \
olacak; güçlü bir parola seçtiğinizden emin olun."""

[m04.preview]
