# ==========================================================================
# Adım 14: Otomatik Ahenk Kaydı (m12_ahenk_reset)
# ==========================================================================

[m12]
title = "Otomatik Ahenk Kaydı"
sidebar_title = "Otomatik Ahenk Kaydı"
apply_hint = "Kaynak MAC kaydedilir, ahenk yoksa kurulur, klon-reclaim boot servisi devreye alınır."
doc_label = "Otomatik Ahenk Kaydı — algoritma akış şeması ve gerekçeler"
rationale = """\
Sınıftaki tahtaları merkezi yönetim iki katmanlı bir sistemle takip eder. \
Birinci katman, merkezi tahta envanter veritabanıdır: her tahta önce buraya \
MAC adresi ve fiziksel konumu (okul, sınıf) esas alınarak, donanım \
özellikleriyle birlikte kaydedilir. Bu kayıt işini tahta üzerindeki \
eta-register uygulaması yapar. İkinci katman Lider yönetim sunucusudur: \
tahta ancak envanterde kayıtlı olduğu doğrulandıktan sonra Lider'e abone \
olabilir — Lider backend, abonelik talebinde envanter servisiyle konuşup \
tahtayı teyit eder; onay verildiğinde tahtaya rastgele bir tekil kimlik atar \
ve aboneliği tamamlar. Bu aşamadan sonra tahta Lider üzerinden yönetici \
yetkisiyle uzaktan yönetilebilir hâle gelir.\n\
\n\
Normal işleyişte tahta klonlandıktan sonra en az bir kez etapadmin oturumu \
açılmalıdır: tahta zaten merkez envantere kayıtlıysa Lider aboneliği \
otomatik gerçekleşir ve her şey hazır hâle gelir; kayıtlı değilse \
eta-register uygulaması açılıp tahtayı önce envantere eklemenizi ister. Ama \
bir sorun vardır: imajı alınan asıl tahta zaten hem envanterde hem de \
Lider'de kayıtlı olduğu için imaj kopyaları hep aynı Lider kimliğiyle boot \
eder; hepsi tek bir tahtaymış gibi görünür, gönderilen komutlar yanlış \
cihaza düşer, izleme güvenilmez olur.\n\
\n\
Bu adım tam da bu sorunu çözer. Ahenk paketini gerekliyse kurar (apt install \
ahenk), sonra imaja her açılışta tahtanın kendisinin \"asıl tahta mı yoksa \
kopya mı?\" olduğunu kontrol eden küçük bir mekanizma yerleştirir. Kopyalık \
tespit edilirse eski Lider kimliği temizlenir ve tahta Lider'e kendi yeni \
kimliğiyle taze abone olur — böylece operatörün, envantere önceden \
kaydedilmiş bir klon tahtada Lider tarafını elle yeniden yapılandırması \
gerekmez, ilk etapadmin girişinde abonelik kendiliğinden gerçekleşir.\n\
\n\
Sınır: bu adım yalnızca Lider kimliği bazlı kilidi çözer. Klonlanmış tahta \
merkez envantere daha önce kaydedilmemişse (ör. yeni gelmiş bir donanım) \
yine klon tahtada etapadmin oturumu açıp eta-register üzerinden envanter \
kaydını yapmanız gerekir; envanter kaydı fiziksel lokasyon bilgisi istediği \
için elle yapılan bir adımdır.\
"""

[m12.preview]
mac_unknown = "(tespit edilemedi)"
header = "Bu adımda yapılacaklar:"
mac_line = "  - Kaynak MAC ({mac}) > {path}"
ahenk_installed = "  - ahenk paketi zaten kurulu - yeniden kurulmayacak."
ahenk_missing = """\
\u0020\u0020- ahenk paketi kurulu DEĞİL - apt update + apt install -y ahenk \
çalıştırılacak, ahenk.service enable edilecek.\
"""
body = """\
\u0020\u0020- {script}\n\
\u0020\u0020- {service} (Type=oneshot, Before=ahenk.service)\n\
\u0020\u0020- systemctl enable {service_name}\n\
\n\
Bu wizard'da ahenk credential'larına DOKUNULMAZ - kaynak tahta normal \
çalışmaya devam eder. Tüm credential temizliği klonun ilk açılışında, boot \
servisi tarafından yapılır.\n\
\n\
Klon makinedeki davranış (her boot, ahenk'ten önce):\n\
\u0020\u0020- İmza dosyası yok             -> çık (klon değil / \
uygulanmamış)\n\
\u0020\u0020- MAC eşit                     -> çık (kaynak tahta)\n\
\u0020\u0020- MAC farklı (klon):\n\
\u0020\u0020\u0020\u0020\u0020\u0020- API hatası               -> bu boot \
atla, sonraki dene\n\
\u0020\u0020\u0020\u0020\u0020\u0020- Kayıtlı                  -> ahenk \
credential temizle,\n\
\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020ahenk \
restart, servis disable\n\
\u0020\u0020\u0020\u0020\u0020\u0020- Kayıtsız                 -> ahenk \
credential temizle,\n\
\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020ahenk \
disable, servis disable\n\
\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020\u0020(kullanıcı \
eta-register'la kayıt yapar)\n\
\n\
Geri al: boot servisi + imza dosyası kaldırılır; ahenk paketi\n\
TiHA kurduysa apt-get purge ile sökülür, daha önce kuruluysa korunur.\
"""

