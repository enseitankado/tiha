# ==========================================================================
# Adım 17: İmaj öncesi temizlik (m10_image_sanitize)
# ==========================================================================

[m10]
title = "İmaj öncesi temizlik"
sidebar_title = "İmaj öncesi temizlik"
apply_hint = "Son adım: tekil kimlikler ve izler temizlenir — imaj alınabilir."
rationale = """\
İmaj almadan önce çalıştırılan ZORUNLU bir adım. Aksi hâlde imajdan çıkan \
bütün tahtalarda aynı makine kimliği (machine-id), aynı SSH ana bilgisayar \
anahtarı, aynı NetworkManager bağlantı UUID'si ve aynı kabuk geçmişi olur. \
Bu sanki çalışıyor gibi görünür ama journald günlüklerinin karışması, SSH \
istemcilerinde 'ana bilgisayar anahtarı değişti' uyarısı ve kablosuz ağ \
parolasının 50 tahtaya aynen sızması gibi sonuçlar doğurur. TiHA bu adımda \
tüm tekil kimlikleri temizler, ilk açılışta kendi benzersiz SSH anahtarını \
üreten bir servis bırakır ve tahtanın imaj alınmaya hazır olmasını sağlar. \
Geri alma anlamlı değildir — silinen kimliği yeniden üretemeyiz.\n\
\n\
Ahenk (LiderAhenk) ajan kimliği bu adımda dokunulmaz; bunun için ayrı bir \
adım vardır (Ahenk kimliği sıfırla). O adım kısmi geri almayı destekler, bu \
sanitize adımı desteklemez.\
"""

[m10.preview]
body = """\
Bu adım uygulandıktan sonra tahta imaj alınmaya hazırdır.\n\
Tahtayı KAPATIN ve işletim sistemiyle açmadan imajı canlı USB'den\n\
(Clonezilla vb.) alın. Açarsanız makine kimliği ve SSH anahtarları\n\
yeniden üretilir ve bütün klonlara aynen gider.\n\
\n\
Aşağıdaki kategoriler temizlenecek (geri alınamaz):\n\
\n\
Tekil kimlikler (her kopya kendi kimliğini üretir):\n\
\u0020\u0020- /etc/machine-id ve /var/lib/dbus/machine-id\n\
\u0020\u0020- /etc/ssh/ssh_host_* (SSH ana bilgisayar anahtarları)\n\
\u0020\u0020- /etc/NetworkManager/system-connections/*\n\
\u0020\u0020\u0020\u0020(kablosuz ağ parolaları dahil bağlantı tanımları)\n\
\u0020\u0020- DHCP/DHCP6 kira (lease) dosyaları\n\
\u0020\u0020- /var/lib/systemd/random-seed\n\
\u0020\u0020- SSH anahtar üretiminin 'yapıldı' işareti\n\
\n\
TiHA'nın hassas yedekleri (/var/lib/tiha, imaja gider):\n\
\u0020\u0020- Parola değişikliğinden önceki /etc/shadow yedeği ve\n\
\u0020\u0020\u0020\u0020kenara alınmış anahtarlıklar\n\
\u0020\u0020- PIN kâğıtları (bütün anahtarlar QR kodlarıyla) ve anahtar\n\
\u0020\u0020\u0020\u0020yedeği. Kâğıdı bu adımdan önce yazdırın ya da \
kaydedin;\n\
\u0020\u0020\u0020\u0020gerekirse PIN adımı yeniden uygulanarak yeniden \
üretilir.\n\
\u0020\u0020- Bu yedekler silindiği için 'Kullanıcı parolaları' ve PIN\n\
\u0020\u0020\u0020\u0020adımları bu adımdan sonra geri alınamaz.\n\
\n\
Not: ahenk (LiderAhenk) ajan kimliği bu adımda dokunulmaz -\n\
klon-yeniden-talep mekanizması bir önceki adımda (m12)\n\
imaja gömülür; credential temizliği klonun ilk açılışında\n\
boot servisi tarafından otomatik yapılır.\n\
\n\
Yer açan ve iz silen temizlikler:\n\
\u0020\u0020- APT önbelleği ve indirilmiş .deb paketleri\n\
\u0020\u0020- Yetim paketler (apt-get autoremove --purge)\n\
\u0020\u0020- Kalıntı yapılandırmalar (rc durumundaki paketler tasfiye \
edilir)\n\
\u0020\u0020- systemd journal (boyut 1 KB'a indirilir)\n\
\u0020\u0020- /var/log altındaki dosyalar (yapı korunur, içerik boşaltılır)\n\
\u0020\u0020- Çökme raporları (/var/crash, /var/lib/whoopsie)\n\
\u0020\u0020- Posta / cups / anacron kuyrukları\n\
\u0020\u0020- man / fontconfig / debconf / lightdm önbellekleri\n\
\u0020\u0020- dpkg yedek dosyaları (*.dpkg-old, *.dpkg-dist, *.ucf-*)\n\
\u0020\u0020- Tüm kullanıcıların ~/.cache, ~/.local/share/Trash ve çeşitli\n\
\u0020\u0020\u0020\u0020geçmiş dosyaları (.bash_history, .lesshst, .viminfo, \
.python_history)\n\
\u0020\u0020- Web tarayıcı önbellekleri ve gezinti verileri\n\
\u0020\u0020\u0020\u0020(Firefox, Chrome, Chromium, Edge, Brave, Vivaldi, \
Opera, Yandex)\n\
\u0020\u0020\u0020\u0020- gezinti geçmişi, çerezler, indirme geçmişi, \
oturumlar, yerel\n\
\u0020\u0020\u0020\u0020\u0020\u0020depolama; tarayıcı tercihleri ve yer \
imleri korunur\n\
\u0020\u0020\u0020\u0020- bayat kilit dosyaları da silinir (Chromium \
türevlerinde\n\
\u0020\u0020\u0020\u0020\u0020\u0020SingletonLock/Socket/Cookie, Firefox'ta \
lock + .parentlock);\n\
\u0020\u0020\u0020\u0020\u0020\u0020aksi hâlde klonlanmış tahtada tarayıcı \
açılmayı reddedebilir\n\
\u0020\u0020- GNOME anahtarlıkları (~/.local/share/keyrings)\n\
\u0020\u0020\u0020\u0020- Chrome Safe Storage anahtarı, uygulamaların \
kaydettiği\n\
\u0020\u0020\u0020\u0020\u0020\u0020parolalar ve PKCS#11 sertifika deposu; \
imajla kopyalanırsa\n\
\u0020\u0020\u0020\u0020\u0020\u0020aynı sır bütün tahtalara dağılır \
(parolasız anahtarlıklar\n\
\u0020\u0020\u0020\u0020\u0020\u0020diskte düz metin tutulduğu için doğrudan \
okunabilir)\n\
\u0020\u0020\u0020\u0020- klon tahtada parola yeniden tanımlandığında \
anahtarlık eski\n\
\u0020\u0020\u0020\u0020\u0020\u0020parolada kalır ve girişte asla \
geçilemeyen 'parola artık\n\
\u0020\u0020\u0020\u0020\u0020\u0020giriş anahtarlığınızla uyuşmuyor' \
diyaloğu çıkar\n\
\u0020\u0020\u0020\u0020- her tahta ilk girişinde kendi anahtarlığını \
otomatik üretir\n\
\u0020\u0020- /tmp ve /var/tmp içerikleri\n\
\u0020\u0020- Kullanılmayan diller için yerelleştirme dosyaları\n\
\u0020\u0020\u0020\u0020({locales} dışındakiler /usr/share/locale altından \
silinir)\n\
\n\
Uyguladıktan sonra: tahtayı kapatın ve imaj alma aracınızı\n\
(Clonezilla vb.) canlı USB'den başlatın. Otomatik Ahenk Kaydı\n\
adımının bu adımdan ÖNCE uygulanmış olması gerekir.\
"""

