# ==========================================================================
# Adım 8: Merkezi log sunucusu (m06_remote_syslog)
# ==========================================================================

[m06]
title = "Dayanıklı merkezi log iletimi"
sidebar_title = "Merkezi log sunucusu"
apply_hint = "Hiç log kaybı olmayan dayanıklı merkezi log iletimi kurulur."
rationale = """\
Tahtanın tüm sistem günlüklerini (oturum açma denemeleri, servis hataları, \
cron, ağ olayları) ağdaki merkezi bir rsyslog sunucusuna DAYANIKLI BİÇİMDE \
gönderir. 50 tahtalı bir okulun loglarını tek bir arayüzden izleyebilir, \
olay/arıza taramasını saniyeler içinde yapabilirsiniz.\n\
\n\
Bu adımı uyguluyorsanız “Benzersiz hostname” adımını da mutlaka uygulayın. \
Aksi hâlde imajdan klonlanan tüm tahtalar aynı hostname ile log gönderir; \
merkezi sunucudaki kayıtları tahta tahta ayırt edemezsiniz. Hostname adımı \
her klona kendi MAC adresinden türeyen benzersiz bir ad verir.\n\
\n\
KRİTİK AVANTAJ: Bu modül HİÇ LOG KAYBI OLMAYAN gelişmiş yapılandırma \
kullanır. Uzak log sunucusu haftalarca hatta aylarca erişilemez durumda olsa \
bile (elektrik kesintisi, ağ bakımı, sunucu arızası), tahta loglarını yerel \
diskte biriktirir — yerel tavan 2 GB olduğundan en kötü profilde bile 3 \
aydan uzun yerel kayıt tutulur. Sunucu geri geldiğinde birikmiş tüm loglar \
otomatik olarak gönderilir.\n\
\n\
Bunun için /etc/rsyslog.d/ altına disk-assisted queue (disk destekli kuyruk) \
kullanan gelişmiş bir yapılandırma dosyası yazılır. Paket güncellemesi \
gelirse yapılandırmanız korunur, geri almak da o tek dosyayı silmek kadar \
kolaydır.\n\
\n\
Log sunucusu tahtalarla aynı ağda olmalı. Okulda tahtalar ve kablosuz erişim \
noktaları (AP) genellikle `10.x.x.x` aralığındadır; log sunucusunu bu ağa \
konumlandırmalısınız. İdari ağdan log sunucusuna erişim olmaz — bu bilinçli \
bir güvenlik kısıtıdır.\
"""

[m06.params.log_profile]
opt_bakim = "Bakım (önerilen)"
opt_kapsamli = "Kapsamlı"
opt_guvenlik = "Yalnız güvenlik"
label = "Log profili"
help = """\
Merkezi sunucuya iletilecek olayların kapsamını seçin. Bakım: donanım \
uyarıları (kern.warning), servis hataları/notice (daemon.notice), kimlik \
doğrulama (auth/authpriv), TiHA + Ahenk servisleri (local0-7). Öğretmen \
davranışı ve tarayıcı içeriği iletilmez. Kapsamlı: her mesaj gönderilir; \
ayıklama için, kalıcı olarak açık tutmayın. Yalnız güvenlik: minimum trafik, \
sadece kimlik ve kritik hatalar.\
"""

[m06.params.syslog_host]
label = "Merkezi log sunucusu (IP veya isim)"

[m06.params.syslog_port]
label = "Port"

[m06.params.syslog_proto]
label = "Protokol"

[m06.params.install_smart_monitoring]
label = "Disk sağlığı + sıcaklık izleme paketlerini kur"
help = """\
İşaretlenirse smartmontools (SMART disk izleme) ve lm-sensors (sıcaklık \
okuma) paketleri kurulur; smartd servisi etkinleştirilir ve sensors-detect \
otomatik çalıştırılır. Bu araçlar 'daemon' facility'sine log yazar; Bakım \
veya Kapsamlı profil seçilmişse otomatik olarak merkezi sunucuya iletilir. \
Böylece disk arızası ve aşırı ısınma erkenden görünür.\
"""

[m06.params.install_node_exporter]
label = "Metrik izleme"
help = """\
İşaretlenirse prometheus-node-exporter paketi kurulup 9100 numaralı porta \
bağlanır. Merkezi Prometheus sunucusu buradan CPU, RAM, disk, sıcaklık, ağ \
ve boot metriklerini toplar; Grafana panosunda onlarca tahtanın sağlığı tek \
ekrandan izlenir.\
"""

[m06.params.node_exporter_listen]
label = "Metrik dinleme adresi"
help = """\
Varsayılan ':9100' — tüm ağ arayüzlerinde dinler; Prometheus scrape'i yapar. \
Güvenlik sıkı istenirse '127.0.0.1:9100' yazın (sadece localhost dinler; \
