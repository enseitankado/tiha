# ==========================================================================
# Adım 15: BIOS parolası (m14_bios_password)
# ==========================================================================

[m14]
title = "BIOS yönetici parolası"
sidebar_title = "BIOS parolası"
doc_label = "https://github.com/enseitankado/eta-112"
apply_hint = """\
Klonun ilk açılışında BIOS yönetici parolasını ayarlayacak tek-seferlik boot \
servisi imaja gömülür.\
"""
rationale = """\
Bu adım, klon makinelerin ilk açılışında BIOS yönetici parolasını sizin \
belirlediğiniz değere ayarlayan tek-seferlik bir boot servisi imaja \
yerleştirir. Kaynak tahtada (yani şu an üzerinde çalıştığınız tahta) BIOS \
parolasına standart Uygula AKIŞINDA DOKUNULMAZ — değişiklik sadece klonda \
ilk açılışta yapılır, başarıyla tamamlandığında servis kendini disable eder \
ve parolayı içeren script silinir.\n\
\n\
Yalnız bu makinenin BIOS parolasını şimdi değiştirmek/temizlemek isterseniz \
“Bu makinenin BIOS parolasını ayarla” düğmesini kullanın — bu düğme klon \
servisi kurmaz; yalnızca buradaki donanıma yazar.\n\
\n\
Parola kutusu BOŞ uygulanırsa parola temizlenir (BIOS koruması fiilen \
kalkar) — bu hem klon servisinin hem de “şimdi uygula” düğmesinin \
davranışıdır.\n\
\n\
Koruma modu: yönetici parolası her açılışta mı yoksa yalnız BIOS setup'a \
girilirken mi sorulsun? Aşağıdan seçin. Faz 2 modellerinde eta-112 bu ayarı \
BIOS'a doğrudan yazar; Faz 1 modellerinde ayrı bir 'ne zaman sorulsun' \
byte'ı olmadığı için arka planda parolaları farklı atayarak aynı sonuç elde \
edilir (yalnız yönetici = setup, yönetici+kullanıcı = her açılışta).\n\
\n\
Bu adım YALNIZCA eta-112 tarafından kalibre edilmiş donanım modellerinde \
uygulanabilir (Faz 2 Vestel Gri vb.). Donanım desteklenmiyorsa form \
gizlenir.\n\
\n\
Mevcut parolaları manuel olarak okumak/değiştirmek veya yeni donanım \
sürümlerini kalibre etmek için aracın GitHub sayfasını kullanabilirsiniz.\
"""

[m14.params.protection_mode]
opt_setup = "Yalnız BIOS ayarlarına girilirken (setup)"
opt_always = "Her açılışta (always)"
label = "Yönetici parolası ne zaman sorulsun"
help = """\
Bu seçim hem klona gömülen servise hem de “Bu makinenin BIOS parolasını \
ayarla” düğmesine uygulanır. Parola kutusu boşsa (clear yolu) bu seçim yok \
sayılır — parola olmadan BIOS koruması zaten etkili değildir.\
"""

[m14.params.supervisor_password]
label = "BIOS yönetici parolası"
help = """\
Yalnızca BÜYÜK harf (A-Z, I hariç) ve rakam (0-9). Uzunluk modele göre 4-12 \
karakter. Kutu boş gelir — donanımdaki mevcut parolayı görmek için aşağıdaki \
düğmeye basın. BOŞ bırakırsanız hem klon servisi hem “şimdi uygula” düğmesi \
parolayı TEMİZLER (BIOS koruması fiilen kalkar).\
"""
placeholder = "ABC23X"

[m14.params.read_current]
label = "Mevcut yönetici parolasını oku"
help = """\
Tıklayınca eta-112 indirilir (gerekirse), donanım sorgulanır; mevcut parola \
ve koruma modu yukarıdaki alanlara yazılır. İlerleme alt kısımda görünür.\
"""

[m14.params.set_local]
label = "Bu makinenin BIOS parolasını ayarla"
help = """\
DİKKAT: Klon servisi KURMAZ; doğrudan bu makinenin BIOS flash'ına yazar. \
Parola kutusu boşsa parolayı TEMİZLER, doluysa girilen parolayı ve koruma \
modunu yazar. Geri alma yoktur; eta-112 “brick riski” uyarısı burada da \
geçerli. Değişikliğin tam etkili olması için işlem sonrası makineyi yeniden \
başlatın.\
"""

