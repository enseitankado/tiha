# ==========================================================================
# Adım 9: Zaman senkronizasyonu (NTP) (m07_time_sync)
# ==========================================================================

[m07]
title = "Zaman senkronizasyonu (NTP)"
sidebar_title = "Zaman senkronizasyonu (NTP)"
apply_hint = "NTP sunucuları ve saat dilimi ayarlanır."
rationale = """\
Tahtanın saatini doğru tutmak için birincil ve yedek zaman (NTP) \
sunucularını tanımlar. Bu adım atlanırsa sahada tahtaların saati kayabilir.\n\
\n\
Neden bu kadar kritik? PIN kodları **zaman tabanlıdır** — her 30 saniyede \
bir değişir. Tahtanın saati, PIN doğrulayan sunucudan 30 saniyeden fazla \
saparsa üretilen HER PIN kodu geçersiz sayılır ve öğretmen tahtaya giremez. \
Bu yüzden NTP'yi bilinen bir sunucuya sabitliyoruz; dış NTP'ye (udp/123) \
kapalı bir okul ağı varsa MEB iç NTP sunucusu kullanılır.\
