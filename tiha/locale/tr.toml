Sonradan okula atanacak öğretmenler için ogretmen1, ogretmen2 … biçiminde \
boş hesaplar hazırlar. Her yedek hesap için ev dizini açılır (useradd), \
hesap EBA QR / eta-usb-login ile aynı standart cihaz gruplarına (ses, USB, \
kamera, yazıcı vb.) eklenir ve parola kilitli tutulur. Eski kurulumlardan \
kalma ogretmen01 / ogretmen.1 biçimindeki hesaplar da mevcut sayılır — \
üzerine yazılmaz. İmaj alındığında bu hesaplar tüm klon tahtalara birlikte \
