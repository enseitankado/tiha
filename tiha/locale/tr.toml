# ==========================================================================
# Adım 10: Dinamik hostname (m08_hostname)
# ==========================================================================

[m08]
title = "Dinamik hostname stratejisi"
sidebar_title = "Dinamik hostname"
apply_hint = "İmaj hostname'i uygulanır; her açılışta dinamik hostname servisi kurulur."
rationale = """\
Aynı imajdan çoğaltılan onlarca tahta ağa bağlandığında, ağı yöneten kişinin \
karşısına hepsi aynı isimle çıkar. Bu durumda hangi tahtanın sınıfta \
hangisi olduğu ayırt edilemez; uzaktan bir tahtaya bağlanmak ya da bir \
sorunu izlemek istendiğinde yanlış cihaza ulaşma riski doğar, merkezi loglar \
birbirine karışır.\n\
\n\
Bu adım her tahtanın ağda kendine özgü, sabit bir isimle görünmesini sağlar \
(örneğin 'etap-ab12cd' gibi). Böylece ağı yöneten kişi sınıftaki her tahtayı \
listede tekil olarak görür, doğru cihaza erişebilir ve sorunu olanı kesin \
biçimde tespit edebilir.\n\
\n\
İmaj alınırken tahtaya geçici, ortak bir isim verilir; her tahta ilk \
açıldığında ise kendi donanımına özgü kalıcı ismine otomatik olarak geçer — \
sahada elle isim atamaya gerek kalmaz.\
"""

[m08.preview]
service_installed = "kurulu"
service_missing = "yok"
status_active = "aktif"
status_inactive = "devre dışı"
body = """\
Mevcut hostname          : {current}\n\
Dinamik hostname servisi : {service}\n\
Servis durumu            : {status}\n\
\n\
Bu adım uygulandığında:\n\
\u0020\u00201) Hostname 'etap-image' (ya da sizin girdiğiniz şablon) olur.\n\
\u0020\u00202) /etc/hosts içindeki 127.0.1.1 satırı yeni isme eşitlenir.\n\
\u0020\u00203) tiha-hostname.service kurulur ve etkinleştirilir.\n\
\n\
Her açılışta tahta:\n\
\u0020\u0020- MAC adresini okur (kablolu NIC'ten)\n\
\u0020\u0020- 'etap-XXXXXX' hostname'i üretir (MAC'in son 6 hanesi)\n\
\u0020\u0020- hostname ve /etc/hosts güncellenir\n\
\u0020\u0020- Zaten doğruysa değişiklik yapmaz\n\
\n\
Avantajlar:\n\
\u0020\u0020- Ağ kartı değişse bile hostname dinamik güncellenir\n\
\u0020\u0020- Her açılışta MAC'e göre benzersizlik garantilenir\n\
\u0020\u0020- Hostname çakışması riski minimize edilir\
"""

[m08.apply]
