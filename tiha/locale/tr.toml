# ==========================================================================
# Adım 7: Dosya sunucusu (m05_samba_share)
# ==========================================================================

[m05]
title = "Dosya sunucusu"
sidebar_title = "Dosya sunucusu"
apply_hint = "Samba kurulur, kök '/' paylaşımı açılır."
rationale = """\
Bu adım, tahtanın tüm diskine ağ üzerinden dosya gezgininden ulaşmanızı \
sağlar. Windows bilgisayarda \"Bilgisayarım\" penceresinin adres çubuğuna \
yazmanız yeterlidir — sürükle-bırak ile dosya taşırsınız.\n\
\n\
Kısacası: bu tahtaya, başına gitmeden ya da USB belleğe dosya yüklemek \
zorunda kalmadan; uzaktaki bilgisayarınızdan erişirsiniz. Güncelleme dosyası \
bırakmak, öğrenci çalışmalarını almak, hata günlüklerini kopyalamak için \
kullanışlıdır.\n\
\n\
Tahtayla aynı ağda olmanız gerekir. Okulda tahtalar ve kablosuz erişim \
noktaları (AP) genellikle `10.x.x.x` aralığındadır; bu ağdaki bir \
bilgisayardan paylaşıma ulaşabilirsiniz. Farklı bir ağdan (örn. \
öğrenci/misafir ağları) ulaşılamaz; bu bilinçli bir güvenlik kısıtıdır.\n\
\n\
Nasıl ulaşılır?\n\
\u0020\u0020• Windows Dosya Gezgini adres çubuğuna:  `\\\\<tahta-ip>\\root`\n\
\u0020\u0020• Linux Dosya Gezgini adres çubuğuna:  \
`smb://<tahta-ip>/{share}`\n\
\u0020\u0020• Ardından belirlediğiniz kullanıcı adı ve parolayı girin.\
"""

[m05.params.samba_user]
label = "Samba kullanıcı adı"

[m05.params.samba_password]
label = "Samba parolası"

[m05.preview]
