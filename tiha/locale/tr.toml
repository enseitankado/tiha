# ==========================================================================
# Adım 16: GRUB koruması (m16_grub_protection)
# ==========================================================================

[m16]
title = "GRUB koruması"
sidebar_title = "GRUB koruması"
apply_hint = """\
İşaretliyken: `e` düzenleme kipi ve GRUB shell, kullanıcı adı `{user}` + \
buraya yazdığınız parolanın arkasına alınır; kurtarma girdisi menüde kalır \
ama o da aynı parolayı ister. İşaretsizken: varsa mevcut koruma kaldırılır, \
GRUB eski hâline döner.\
"""
rationale = """\
GRUB açılış menüsünde ``e`` tuşu kernel komut satırının düzenlenmesine izin \
verir. Yerel klavye erişimi olan biri buraya ``init=/bin/bash`` yazarak \
tahtayı doğrudan root shell'e düşürebilir; root parolasını sıfırlamak, diski \
okumak, kalıcı arka kapı bırakmak buradan mümkündür. m02 (Açılışta parola \
temizliği) etkin olsa dahi o oturum içindeki hasar sınırsızdır. Aynı vektör \
kurtarma (recovery) girdisi üzerinden de açıktır: kurtarma kipi parola \
sormadan root kabuğu verir.\n\
\n\
Bu adım aşağıdaki 'GRUB yönetici parolası' alanına yazdığınız parolayı \
PBKDF2-SHA512 hash'i olarak GRUB'a tanımlar (kullanıcı adı: ``etapadmin``) \
ve normal menü girdilerini ``--unrestricted`` işaretler. Kurtarma girdisi \
menüde kalır ama bu işareti almaz: onu açmak da aynı kullanıcı adı ve \
parolayı ister. 'Gelişmiş seçenekler' alt menüsü de parolalıdır. Boot akışı \
bu parolayı sormaz; yalnız kullanıcı menüde ``e`` (düzenle) kipine \
girdiğinde, GRUB shell'ine (``c`` tuşu) düştüğünde ya da kurtarma/gelişmiş \
seçenekleri açtığında sorulur. Aynı hash bütün klonlara aynen taşınır; \
operatör tek bir parolayı hatırlar.\n\
\n\
Kutucuk adıma girildiğinde sistemin o anki durumunu gösterir: GRUB zaten \
korumalıysa işaretli gelir. İşaretini kaldırıp uygularsanız koruma \
kaldırılır ve GRUB yedeklerden eski hâline döndürülür. Koruma etkinken \
parola alanını boş bırakıp uygularsanız mevcut parola korunur. Düz parola \
sistemde tutulmaz; imaja yalnız hash gömülür.\
"""
recovery_reopen = "Kurtarma girdisi yeniden açılıyor (GRUB_DISABLE_RECOVERY yoruma alınıyor)…"
saved_reset = "Kayıtlı açılış varsayılanı alt menüyü gösteriyor ({saved}); sıfırlanıyor…"

